[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gpuflow"
version = "0.1.0"
description = "Alibaba GPU trace resource management and scheduling simulator"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=3.0,<4",
  "plotly>=6,<8",
  "sqlalchemy>=2.0,<3",
  "streamlit>=1.50,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
